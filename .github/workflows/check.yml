name: Check source and Orca SDK

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      orca_sdk_release:
        description: 'Published Orca tag containing the companion host APIs; leave blank for source checks only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  source:
    name: Source inventory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:source
      - name: Describe verification scope
        shell: bash
        run: echo 'Source inventory passed. SDK and desktop verification require the compatible companion host described in docs/releasing.md.' >> "$GITHUB_STEP_SUMMARY"

  sdk:
    name: Orca SDK verification
    needs: source
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.orca_sdk_release != '')
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      ORCA_RELEASE: ${{ inputs.orca_sdk_release || vars.ORCA_SDK_RELEASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Require an explicitly verified host release
        shell: bash
        run: |
          if [[ ! "$ORCA_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'A compatible public Orca release is required. See docs/releasing.md; current public v1.4.256 does not contain the companion APIs.' >&2
            exit 1
          fi
      - name: Install the official host CLI without opening the desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) artifact="Orca-${ORCA_RELEASE#v}-arm64-mac.zip" ;;
            x86_64) artifact="Orca-${ORCA_RELEASE#v}-mac.zip" ;;
            *) echo 'Unsupported macOS runner architecture' >&2; exit 1 ;;
          esac
          metadata=$(gh api "repos/stablyai/orca/releases/tags/$ORCA_RELEASE")
          digest=$(jq -er --arg name "$artifact" '.assets[] | select(.name == $name) | .digest | select(test("^sha256:[a-f0-9]{64}$")) | sub("^sha256:"; "")' <<< "$metadata")
          sdk_dir="$RUNNER_TEMP/meego-orca-sdk"
          mkdir -p "$sdk_dir"
          gh release download "$ORCA_RELEASE" --repo stablyai/orca --pattern "$artifact" --dir "$sdk_dir"
          printf '%s  %s\n' "$digest" "$sdk_dir/$artifact" | shasum -a 256 -c -
          ditto -x -k "$sdk_dir/$artifact" "$sdk_dir/unpacked"
          codesign --verify --deep --strict "$sdk_dir/unpacked/Orca.app"
          printf '%s\n' "$sdk_dir/unpacked/Orca.app/Contents/Resources/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Match a pushed tag to the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const m=require("./orca-plugin.json");if(process.env.GITHUB_REF_NAME!==`v${m.version}`)throw new Error("Tag does not match plugin version")'
      - run: npm run check
